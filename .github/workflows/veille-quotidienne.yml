name: Veille quotidienne

on:
  schedule:
    # Tous les jours à 7h00 UTC (8h00 heure du Bénin, UTC+1)
    - cron: "0 7 * * *"
  workflow_dispatch:
    # Permet aussi de lancer la veille manuellement depuis l'onglet "Actions" de GitHub

jobs:
  veille:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Lancer la veille
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SLIDESGPT_API_KEY: ${{ secrets.SLIDESGPT_API_KEY }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_RECIPIENT: ${{ secrets.EMAIL_RECIPIENT }}
        run: python main.py "l'IA dans le monde" --hours 24

      - name: Sauvegarder l'historique mis à jour
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          git diff --quiet --cached || git commit -m "Veille automatique du $(date +'%d/%m/%Y')"
          git push
